# Overrides webdevops/php-nginx's auto-generated 10-location-root.conf.
#
# That image's entrypoint regenerates this file at every container start, built from the
# WEB_DOCUMENT_INDEX env var (set below to "index.php index.html" so /sismos-vzla/ serves its
# own static index.html). With two values, its template emits:
#
#   try_files $uri $uri/ /index.php index.html?$query_string;
#
# try_files treats every parameter except the last as a plain file-existence check, not a
# routing target. Since /index.php always exists at the document root, that check always
# succeeds, so nginx serves it as a static file (raw source, Content-Type: application/
# octet-stream) instead of ever reaching the fastcgi location that executes it -- breaking every
# route except the bare "/" (which resolves via the separate `index` directive, not try_files).
# Found and fixed live in production 2026-09-06; see .specs/002-data-migration/runbook.md.
#
# The fix: index.php?$query_string as the sole, final parameter -- the only way try_files
# treats it as an internal redirect target. Static directory-index serving (index.html for
# directories that have one, like /sismos-vzla/) still works via `$uri/` + the `index` directive;
# it never needed a second try_files candidate.
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
